name: our_days_off
description: "Privacy-first schedule matching and social coordination mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1

  # Networking & Logging
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Routing & Deep Linking
  go_router: ^14.0.1

  # Secure Storage & Caching
  flutter_secure_storage: ^9.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # UI Components & Icons
  table_calendar: ^3.1.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  flutter_colorpicker: ^1.1.0

  # Media & File Picking
  image_picker: ^1.1.0
  file_picker: ^8.0.0+1

  # Utilities & System Integration
  intl: ^0.19.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  path_provider: ^2.1.3
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
